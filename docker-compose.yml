services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
      - TUTOROPS_DB_PATH=/data/tutorops.db
    volumes:
      - tutorops_data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    working_dir: /app

  web:
    image: nginx:alpine
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro,Z

volumes:
  tutorops_data:
