<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TutorOps Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="container">
    <h1>TutorOps</h1>

    <div class="row">
      <label class="field">
        <span>API Base URL</span>
        <input id="apiBase" type="text" value="http://localhost:8000" />
      </label>
      <button id="refreshBtn">Refresh</button>
    </div>

    <div id="status" class="status muted"></div>
  </header>

  <main class="container grid">
    <!-- Create Client -->
    <section class="card">
      <h2>Create Client</h2>
      <form id="clientForm" class="stack">
        <div class="row">
          <label class="field">
            <span>First name</span>
            <input name="first_name" required />
          </label>
          <label class="field">
            <span>Last name</span>
            <input name="last_name" required />
          </label>
        </div>

        <div class="row">
          <label class="field">
            <span>Email</span>
            <input name="email" type="email" required />
          </label>
          <label class="field">
            <span>Phone (optional)</span>
            <input name="phone" placeholder="###-###-####" />
          </label>
        </div>

        <div class="row">
          <label class="field">
            <span>Subject (optional)</span>
            <input name="subject" placeholder="Math" />
          </label>
          <label class="field">
            <span>Hourly rate</span>
            <input name="hourly_rate" type="number" step="0.01" min="0" required />
          </label>
        </div>

        <button type="submit">Create</button>
      </form>
    </section>

    <!-- Create Session -->
    <section class="card">
      <h2>Create Session</h2>
      <form id="sessionForm" class="stack">
        <label class="field">
          <span>Client</span>
          <select name="client_id" id="clientSelect" required></select>
        </label>

        <div class="row">
          <label class="field">
            <span>Date</span>
            <input name="date" type="date" required />
          </label>
          <label class="field">
            <span>Duration (hours)</span>
            <input name="duration_hours" type="number" step="0.25" min="0" required />
          </label>
        </div>

        <label class="field">
          <span>Topic (optional)</span>
          <input name="topic" placeholder="Derivatives" />
        </label>

        <label class="field">
          <span>Notes (optional)</span>
          <textarea name="notes" rows="3" placeholder="What you covered..."></textarea>
        </label>

        <button type="submit">Log Session</button>
      </form>
    </section>

    <!-- Clients table -->
    <section class="card">
      <h2>Clients</h2>
      <div class="row">
        <label class="field grow">
          <span>Filter</span>
          <input id="clientFilter" placeholder="type to filter by name/email..." />
        </label>
        <button id="loadClientsBtn">Load</button>
      </div>

      <div class="tableWrap">
        <table id="clientsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Rate</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- Summary -->
    <section class="card">
      <h2>Summary</h2>
      <div class="row">
        <button id="loadGlobalSummaryBtn">Global Summary</button>
        <button id="loadClientSummaryBtn">Selected Client Summary</button>
      </div>

      <pre id="summaryBox" class="pre"></pre>
    </section>
  </main>

  <footer class="container muted">
    Tip: run the frontend with a local server (see instructions below).
  </footer>

  <script src="app.js"></script>
</body>
</html>
